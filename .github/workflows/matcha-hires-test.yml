name: Check original matcha resolution
on:
  push:
    branches: [main]
    paths: ['.github/workflows/matcha-hires-test.yml']
permissions:
  contents: write
jobs:
  test-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attempt full-resolution artwork transfer
        run: |
          if curl -L -f -sS -m 30 'https://media.canva.com/v2/image-resize/format:JPG/height:1200/quality:75/uri:ifs%3A%2F%2FM%2F1d30aae8-822c-4a40-9617-ba4a35e09ebb/watermark:F/width:910?csig=AAAAAAAAAAAAAAAAAAAAABb9E2itEzui_h2_drZY33uwyT-6BiCC3nuOWNijwRup&exp=1793509046&osig=AAAAAAAAAAAAAAAAAAAAAAJ7ChRtVDD-2i_1S-od7B_Vlw7dpZ8EqkfypLf4XhH-&signer=media-rpc&token=AAIAAU0AJDFkMzBhYWU4LTgyMmMtNGE0MC05NjE3LWJhNGEzNWUwOWViYgAAAAABoZV4NvAeCact90neeN9_7Xp3z5C9NnXA3MXt7xgfvvkiRvj7Gw&x-canva-quality=thumbnail' -o /tmp/new-matcha.jpg; then
            bytes=$(wc -c < /tmp/new-matcha.jpg)
            echo "CANDIDATE_BYTES=$bytes"
            if [ "$bytes" -gt 30000 ]; then
              cp /tmp/new-matcha.jpg content-lab/public/prompts/matcha-01.jpg
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add content-lab/public/prompts/matcha-01.jpg
              git diff --cached --quiet || (git commit -m 'assets(content-lab): upgrade matcha example to higher resolution' && git push)
              echo 'UPGRADED_PHOTO'
            else echo 'PREVIEW_ONLY'; fi
          else echo 'HIGH_RES_UNAVAILABLE'; fi
