name: Verificar fichas y conectores del Studio (sin publicar)
on:
  pull_request:
    paths:
      - "estudio-control/src/ClassProduction.tsx"
      - "estudio-control/src/CasaBrownieStudioKit.tsx"
      - "estudio-control/src/CasaBrowniePhotoSteps.tsx"
      - "estudio-control/src/casa-brownie-kit.css"
      - "estudio-control/src/Studio.tsx"
      - "estudio-control/src/ConnectorsLesson.tsx"
      - "estudio-control/src/class-course.ts"
      - "estudio-control/src/recording-starts.ts"
      - "estudio-control/src/connectors-lesson.css"
      - "estudio-control/tests/class-course.test.mjs"
      - "alumnos/guia-principiantes.js"
      - "alumnos/materiales-interactivos.js"
      - "alumnos/materiales-interactivos.css"
      - "alumnos/recursos-avanzados.js"
      - "alumnos/curso.js"
      - "alumnos/index.html"
      - ".github/workflows/studio-course-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias sin publicar
        working-directory: estudio-control
        run: npm install --no-audit --no-fund
      - name: Revisar sintaxis de los recursos nuevos del aula
        run: |
          node --check alumnos/guia-principiantes.js
          node --check alumnos/materiales-interactivos.js
          node --check alumnos/recursos-avanzados.js
      - name: Compilar Studio
        working-directory: estudio-control
        run: npm run build
      - name: Comprobar estructura y guiones
        working-directory: estudio-control
        run: npm run test:classes
