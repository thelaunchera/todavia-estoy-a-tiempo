name: Content Lab portable checks
on:
  push:
    branches: [main]
    paths:
      - 'content-lab/**'
      - 'scripts/check-inline-scripts.mjs'
      - 'estudio-control/src/**'
      - 'estudio-control/package.json'
      - '.github/workflows/content-lab-ci.yml'
  pull_request:
    paths:
      - 'content-lab/**'
      - 'scripts/check-inline-scripts.mjs'
      - 'estudio-control/src/**'
      - 'estudio-control/package.json'
      - '.github/workflows/content-lab-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: content-lab
      - name: Check inline JavaScript in public pages
        run: node scripts/check-inline-scripts.mjs
      - name: Run portable smoke tests
        run: npm test
        working-directory: content-lab
      - name: Type-check React and editor
        run: npx tsc --noEmit
        working-directory: content-lab
      - name: Build React app
        run: npm run build
        working-directory: content-lab
      - name: Verify build output
        run: test -s content-lab/dist/index.html
      - name: Install Studio dependencies
        # The browser build does not run ONNX native Node binaries.
        # Skip flaky postinstall downloads from the optional onnxruntime-node package.
        run: npm install --no-audit --no-fund --ignore-scripts
        working-directory: estudio-control
      - name: Type-check Studio TypeScript
        run: npx tsc --noEmit
        working-directory: estudio-control
      - name: Build private seamless Studio editor
        run: npm run build
        working-directory: estudio-control
