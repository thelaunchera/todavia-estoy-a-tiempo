name: Publicar landing y Estudio del podcast
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Mantener una sola fuente de publicación de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --location --output /tmp/podcast-pages-config.json --write-out '%{http_code}' \
            --request PUT \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/${{ github.repository }}/pages' \
            --data '{"build_type":"workflow"}')
          if [ "$status" = "204" ]; then
            echo "GitHub Pages: source GitHub Actions confirmada."
          else
            echo "::warning::No se pudo ajustar la fuente de Pages automáticamente (HTTP $status). En Settings > Pages elegir GitHub Actions."
          fi
      - name: Preparar logo oficial en PNG para correos
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          source = Path("assets/logo-podcast-04.svg").read_bytes()
          cairosvg.svg2png(bytestring=source, write_to="assets/logo-podcast-04-email.png", output_width=900)
          # Email illustrations use opaque backgrounds so Gmail dark mode cannot
          # invert the card and make the logo illegible.
          logo_card = source.replace(b'#131925', b'#FBE8E8')
          cairosvg.svg2png(
              bytestring=logo_card,
              write_to="assets/logo-podcast-04-email-contrast.png",
              output_width=960,
              background_color="#292326")
          spotify_mark = b'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="31" fill="#18221C"/>
            <path d="M14 23 C26 19 42 21 51 26" stroke="#F4CCD7" stroke-width="5.6" stroke-linecap="round" fill="none"/>
            <path d="M17 33 C28 30 41 32 48 36" stroke="#F4CCD7" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M20 42 C29 40 39 42 45 45" stroke="#F4CCD7" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          </svg>'''
          cairosvg.svg2png(bytestring=spotify_mark, write_to="assets/spotify-mark-email.png", output_width=128)
          cairosvg.svg2png(bytestring=source.replace(b'#131925', b'#f7f3eb'), write_to="assets/logo-podcast-04-light.png", output_width=900)
          cairosvg.svg2png(bytestring=source, write_to="assets/logo-podcast-04-social-dark.png", output_width=1600)
          cairosvg.svg2png(bytestring=source.replace(b'#131925', b'#f7f3eb'), write_to="assets/logo-podcast-04-social-light.png", output_width=1600)
          PY
      - name: Preparar Node para el Estudio de Control
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar esquema y permisos del podcast
        run: node estudio-control/tests/check-schema.mjs
      - name: Validar instalación de la web app
        run: node estudio-control/tests/check-pwa.mjs
      - name: Validar privacidad compacta y portada de episodio sin destellos
        run: node estudio-control/tests/check-landing-privacy.mjs
      - name: Verificar precios, enlaces y créditos públicos
        run: node estudio-control/tests/check-public-consistency.mjs
      - name: Revisar preventa y privacidad del aula antes de empaquetar
        run: |
          node --check clases/experience.js
          node --check clases/countdown.js
          node --check clases/waitlist.js
          node --check alumnos/comunidad.js
          node estudio-control/tests/check-course-prelaunch.mjs
          node --test estudio-control/tests/aula-privacidad-regresion.test.mjs alumnos/dashboard-inicio.test.mjs
      - name: Compilar el estudio desde el repositorio
        env:
          VITE_PODCAST_SUPABASE_URL: ${{ vars.VITE_PODCAST_SUPABASE_URL }}
          VITE_PODCAST_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_PODCAST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd estudio-control
          npm install --no-audit --no-fund
          npm run test:spotify-links
          npm run test:editorial-plan
          npm run test:classes
          npm run build
      - name: Verificar iconos propios del Studio para iPhone y Android
        run: |
          test -s estudio-control/dist/icons/studio-blue-192.png
          test -s estudio-control/dist/icons/studio-blue-512.png
          test -s estudio-control/dist/icons/apple-touch-studio-blue.png
      - name: Empaquetar el podcast y su estudio
        run: |
          mkdir -p _podcast_pages/estudio
          cp -R assets productos clases alumnos _podcast_pages/
          cp -- *.html *.css *.js *.xml *.txt CNAME _podcast_pages/
          cp .nojekyll _podcast_pages/
          cp -R estudio-control/dist/. _podcast_pages/estudio/
      - name: Verificar que se publican landing y Estudio
        run: |
          test -s _podcast_pages/index.html
          test -s _podcast_pages/estudio/index.html
          test -s _podcast_pages/estudio/manifest.webmanifest
          test -s _podcast_pages/clases/primera-landing.html
          test -s _podcast_pages/alumnos/index.html
          test -s _podcast_pages/alumnos/curso.js
          test -s _podcast_pages/alumnos/comunidad.html
          test -s _podcast_pages/alumnos/comunidad.js
          test -s _podcast_pages/alumnos/comunidad.css
          test -s _podcast_pages/clases/waitlist.js
          test -s _podcast_pages/clases/experience.js
          test -s _podcast_pages/clases/countdown.js
          grep -q 'src="./assets/' _podcast_pages/estudio/index.html || grep -q 'src="/assets/' _podcast_pages/estudio/index.html
          echo 'Landing y Estudio presentes en el artefacto de Pages.'
      - name: Empaquetar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: _podcast_pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar landing y Estudio
        id: deployment
        uses: actions/deploy-pages@v4
