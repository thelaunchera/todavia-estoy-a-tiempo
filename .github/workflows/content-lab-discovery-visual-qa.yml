name: Content Lab public landing visual QA
on:
  push:
    branches: [main]
    paths:
      - 'content-lab/public/descubre/**'
      - 'content-lab/scripts/qa-discover.mjs'
      - '.github/workflows/content-lab-discovery-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --no-save --no-audit --no-fund playwright@1.58.2
        working-directory: content-lab
      - name: Install headless Chromium
        run: npx playwright install chromium
        working-directory: content-lab
      - name: Test public sales pages with a real browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tle-discover-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          node scripts/qa-discover.mjs
        working-directory: content-lab
        env:
          QA_URL: http://127.0.0.1:4173
      - name: Preserve screenshots, even after a failed check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-lab-editorial-visual-qa
          path: content-lab/artifacts/discover-visual/*.png
          if-no-files-found: ignore
