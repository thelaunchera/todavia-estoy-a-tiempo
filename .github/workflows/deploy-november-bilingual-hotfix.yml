name: Publicar freebies y Studio desde la compilación completa
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# The old snapshot overlay depended on an unavailable artifact and could replace
# newer Lab changes. Manual releases now use the same checked, serialized build.
jobs:
  publish:
    uses: ./.github/workflows/pages.yml
    secrets: inherit
