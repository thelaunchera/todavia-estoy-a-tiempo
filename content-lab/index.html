<!doctype html>
<html lang="es" class="lab-style-fallback">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Content Lab — Private Creative HQ</title>

  <!-- A small self-contained shell remains usable even if Safari loses the CSS file. -->
  <style>
    html.lab-style-fallback,html.lab-style-fallback body{margin:0;background:#f8f8f6;font-family:Arial,system-ui,sans-serif;color:#191919}
    html.lab-style-fallback *{box-sizing:border-box}
    html.lab-style-fallback button,html.lab-style-fallback input,html.lab-style-fallback select{font:inherit}
    html.lab-style-fallback .app-shell{display:flex;min-height:100vh}
    html.lab-style-fallback .sidebar{position:fixed;z-index:12;top:0;left:0;bottom:0;width:266px;max-width:85vw;padding:20px 14px;background:#fff;overflow-y:auto;border-right:1px solid #dae5e8}
    html.lab-style-fallback .sidebar nav{display:flex;flex-direction:column;gap:6px}
    html.lab-style-fallback .sidebar nav button{display:flex;align-items:center;gap:9px;width:100%;min-height:42px;padding:8px;border:0;background:transparent;text-align:left;color:#244b5c;border-radius:9px}
    html.lab-style-fallback .sidebar nav button.active{background:#e5f0f5}
    html.lab-style-fallback .side-label{display:block;font-size:10px;color:#617b86;letter-spacing:1px;margin:12px 0 5px}
    html.lab-style-fallback .identity{display:flex;align-items:center;gap:9px;margin-bottom:16px}
    html.lab-style-fallback .logo{font-size:19px;font-weight:bold}
    html.lab-style-fallback .app-shell main{margin-left:266px;min-width:0;width:calc(100% - 266px)}
    html.lab-style-fallback .top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:70px;padding:9px 14px;background:white}
    html.lab-style-fallback .lab-mobile-dock{display:none}
    @media(max-width:850px){
      html.lab-style-fallback .sidebar{transform:translateX(-105%)}
      html.lab-style-fallback .sidebar.open{transform:translateX(0)}
      html.lab-style-fallback .overlay{position:fixed;inset:0;background:#0d1d2570;z-index:11}
      html.lab-style-fallback .app-shell main{margin:0;width:100%;padding-bottom:90px}
      html.lab-style-fallback .top{position:sticky;top:0;z-index:8}
      html.lab-style-fallback .app-shell>.lab-mobile-dock{position:fixed;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));inset:auto 0 0;z-index:9;background:#fff;border-top:1px solid #dce6e8;padding:7px 4px max(7px,env(safe-area-inset-bottom,0px))}
      html.lab-style-fallback .lab-mobile-dock button{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;min-width:0;min-height:52px;padding:4px 0;border:0;border-radius:9px;background:transparent;font-size:9px;color:#385967}
      html.lab-style-fallback .lab-mobile-dock button.active{background:#e7f0f3}
    }
  </style>
  <script>
    (function(){
      const prefix='/content-lab/';
      let tries=0,loading=false;
      const healthy=()=>getComputedStyle(document.documentElement)
        .getPropertyValue('--content-lab-css-ready').trim()==='1';
      const restore=()=>{if(healthy()){document.documentElement.classList.remove('lab-style-fallback');return true;}return false};
      const fallback=()=>{
        if(restore()||loading||tries>=2)return;
        tries++;loading=true;
        const link=document.createElement('link');
        link.rel='stylesheet';
        link.href=prefix+'lab-recovery.css?attempt='+tries+'&ts='+Date.now();
        link.onload=()=>{loading=false;if(!restore()&&tries<2)fallback();};
        link.onerror=()=>{loading=false;if(tries<2)setTimeout(fallback,1300);};
        document.head.appendChild(link);
      };
      const inspect=()=>{if(document.getElementById('root')?.children.length&&!restore())fallback();};
      const start=()=>{
        document.querySelectorAll('link[rel="stylesheet"]').forEach(link=>{
          if(link.href.includes(prefix+'assets/'))link.addEventListener('error',fallback,{once:true});
        });
        setTimeout(inspect,700);
      };
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});
      else start();
      addEventListener('pageshow',()=>setTimeout(inspect,350));
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(inspect,350);});
    })();
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
