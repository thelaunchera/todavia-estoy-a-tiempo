<!doctype html>
<html lang="es">
<head><script src="privacy-controls.js?v=20261027-compact-v2" data-site="podcast"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <meta name="description" content="Dejar de recibir avisos de los nuevos episodios de Todavía estoy a tiempo.">
  <title>Tu espacio, tus tiempos · Todavía estoy a tiempo</title>
  <link rel="icon" href="assets/monograma-podcast-04.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles-redesign.css?v=20261022-newsletter-v1">
  <script defer src="site-config.js?v=20261022-newsletter-v1"></script>
  <style>
    .unsubscribe-page{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 20% 18%,#e0e9eb 0%,transparent 50%),linear-gradient(135deg,#f8f5ed,#f0f1ee);color:#172940}
    .unsubscribe-header{width:min(920px,calc(100% - 44px));margin:0 auto;padding:26px 0}
    .unsubscribe-header img{display:block;width:clamp(185px,26vw,255px);height:auto}
    .unsubscribe-content{width:min(560px,calc(100% - 44px));margin:auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding:44px 0 85px}
    .unsubscribe-kicker{font-size:.66rem;letter-spacing:.16em;font-weight:700;color:#54708a;margin:0 0 17px}
    .unsubscribe-content h1{font:400 clamp(2.75rem,8vw,4.6rem)/1.07 var(--serif);letter-spacing:-.04em;margin:0 0 21px}
    .unsubscribe-content h1 em{color:#45698b}
    .unsubscribe-copy{color:#536172;font-size:1.03rem;line-height:1.8;margin:0 0 28px;max-width:520px}
    .unsubscribe-form label{display:block;font-size:.82rem;font-weight:700;margin-bottom:11px}
    .unsubscribe-form input{display:block;width:100%;height:50px;border:1px solid #9caab4;background:#fffdfa;border-radius:14px;padding:0 17px;color:#172940;font:400 1rem var(--sans)}
    .unsubscribe-form button{margin:17px 0 0;border:0;border-radius:30px;background:#172940;color:#fff;height:49px;padding:0 25px;font-weight:600;cursor:pointer}
    .unsubscribe-form button:active{transform:scale(.96)}
    .unsubscribe-form button:focus-visible,.unsubscribe-form input:focus-visible{outline:3px solid #abc6d9;outline-offset:4px}
    .unsubscribe-status{min-height:34px;margin-top:15px;font-size:.89rem;line-height:1.5;color:#45698b}
    .unsubscribe-back{display:inline-block;font-size:.87rem;margin-top:10px;text-underline-offset:5px}
    .unsubscribe-footer{padding:18px 22px;text-align:center;border-top:1px solid #c9d3d8;color:#667787;font-size:.76rem}
  </style>
<meta name="robots" content="noindex,follow"><link rel="canonical" href="https://podcast.thelaunchera.com/baja.html"></head>
<body class="unsubscribe-page">
  <header class="unsubscribe-header"><a href="index.html" aria-label="Todavía estoy a tiempo, inicio"><img src="assets/logo-podcast-04.svg" width="726" height="250" alt="Todavía estoy a tiempo"></a></header>
  <main class="unsubscribe-content" id="principal">
    <p class="unsubscribe-kicker">A TU PROPIO RITMO</p>
    <h1>El tiempo de <em>elegir es tuyo.</em></h1>
    <p class="unsubscribe-copy">Si prefieres no recibir más correos cuando publique un nuevo episodio, puedes dejarlo aquí. No necesitas dar explicaciones.</p>
    <form id="unsubscribe-form" class="unsubscribe-form" novalidate>
      <label for="unsubscribe-email">Correo en el que recibes los avisos</label>
      <input type="email" inputmode="email" id="unsubscribe-email" name="email" autocomplete="email" placeholder="tu@email.com" required maxlength="254" aria-describedby="unsubscribe-status">
      <button type="submit">Dejar de recibir avisos</button>
      <p id="unsubscribe-status" class="unsubscribe-status" role="status" aria-live="polite"></p>
    </form>
    <a href="index.html" class="unsubscribe-back">Volver al podcast</a>
  </main>
  <footer class="unsubscribe-footer">Todavía estoy a tiempo · 2026 <span aria-hidden="true">·</span> <a href="https://thelaunchera.com/" target="_blank" rel="noopener noreferrer" lang="en" style="color:inherit">Powered by The Launch Era</a></footer>
  <script>
    (() => {
      const form=document.getElementById('unsubscribe-form');
      const input=document.getElementById('unsubscribe-email');
      const btn=form.querySelector('button');
      const status=document.getElementById('unsubscribe-status');
      form.addEventListener('submit',async event=>{
        event.preventDefault();
        const email=input.value.trim().toLowerCase();
        status.textContent='';
        const valid=email.length<=254&&/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
        if(!valid){status.textContent='Revisa tu correo para poder encontrarlo.';input.setAttribute('aria-invalid','true');input.focus();return;}
        const url=window.PODCAST_CONFIG?.unsubscribeEndpoint;
        try{
          if(!url||!url.startsWith('https://'))throw new Error('No disponible');
          btn.disabled=true;input.disabled=true;btn.textContent='Guardando tu decisión…';
          const response=await fetch(url,{method:'POST',mode:'cors',headers:{Accept:'application/json'},body:new URLSearchParams({email,resource:'podcast_unsubscribe',action:'unsubscribe',source:'unsubscribe_page',website:''})});
          if(!response.ok||(await response.json())?.ok!==true)throw new Error('No confirmada');
          status.textContent='Listo. Ya no recibirás avisos de nuevos episodios. Gracias por haber estado aquí.';
          form.reset();input.setAttribute('aria-invalid','false');btn.textContent='Baja confirmada';
        }catch(e){
          input.disabled=false;btn.disabled=false;btn.textContent='Dejar de recibir avisos';
          status.textContent='No se pudo confirmar el cambio. Inténtalo de nuevo.';
        }
      });
    })();
  </script>
</body>
</html>
